    </div>
  </div>
</template>

<div class="toast" id="toast"></div>
<script src="assets/app.js"></script>
<script>
  (function () {
    var map = {
      codex: { t: 'Codex', v: 'codex-cli 0.166.0', logo: 'codex' },
      qoder: { t: 'Qoder', v: 'qodercli 1.1.81', logo: 'qoder' },
      agy: { t: 'Antigravity CLI', v: 'agy 1.4.12', logo: 'agy' },
      opencode: { t: 'OpenCode', v: 'opencode 2.2.5', logo: 'opencode' }
    };
    var id = (new URLSearchParams(location.search)).get('t');
    id = id ? id.toLowerCase() : '';
    var known = Object.prototype.hasOwnProperty.call(map, id);

    var body = document.getElementById('t-body');
    var tpl = document.querySelector('template[data-tool="' + (known ? id : '__none__') + '"]');
    if (tpl) body.appendChild(tpl.content.cloneNode(true));

    var title = document.getElementById('t-title');
    var ver = document.getElementById('t-ver');
    var lg = document.getElementById('t-logo');

    /* the tile class carries the bed the mark needs; '' = unknown tool */
    function setLogo(file, alt) {
      lg.className = 'logo ' + (file ? 'lg-' + file : 'lg-none');
      lg.textContent = '';
      if (!file) { lg.textContent = '?'; return; }
      var img = document.createElement('img');
      img.src = 'assets/logos/' + file + '.svg';
      img.alt = alt;
      lg.appendChild(img);
    }

    if (known) {
      var d = map[id];
      title.textContent = d.t;
      title.removeAttribute('data-en'); title.removeAttribute('data-vi');
      ver.textContent = d.v;
      setLogo(d.logo, d.t);
      document.title = d.t + ' · Agent Fleet web demo';
    } else {
      // No data-tool match: show an empty state, never fall back to Codex.
      title.setAttribute('data-en', 'Tool not found');
      title.setAttribute('data-vi', 'Không tìm thấy công cụ');
      title.textContent = AF.lang === 'vi' ? 'Không tìm thấy công cụ' : 'Tool not found';
      ver.textContent = '';
      setLogo('', '');
      document.title = 'Tool not found · Agent Fleet web demo';
    }

    // <template> content is not covered by app.js's initial pass: re-apply now.
    AF.setLang(AF.lang);
  })();
</script>
</body>
